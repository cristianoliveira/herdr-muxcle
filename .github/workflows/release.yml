name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts
      - run: node scripts/release-tag.mjs "$GITHUB_REF_NAME"
      - run: make release-ci
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/herdr-muxcle-v${version}.tar.gz" \
            "dist/herdr-muxcle-v${version}.tar.gz.sha256" \
            "dist/muxcle-tmux-keys-v${version}.tar.gz" \
            "dist/muxcle-tmux-keys-v${version}.tar.gz.sha256" \
            "dist/muxcle-sessionizer-v${version}.tar.gz" \
            "dist/muxcle-sessionizer-v${version}.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" --generate-notes
