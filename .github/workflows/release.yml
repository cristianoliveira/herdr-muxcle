name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
      - run: npm ci --ignore-scripts
      - run: node scripts/release-tag.mjs "$GITHUB_REF_NAME"
      - run: make release-ci
      - name: Create draft release from the shared package catalog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          assets_file="$RUNNER_TEMP/release-assets.txt"
          node scripts/release-plan.mjs --version "$version" --format notes > "$notes_file"
          node scripts/release-plan.mjs --version "$version" --format assets > "$assets_file"
          mapfile -t assets < "$assets_file"
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            --draft
