on:
  change: "**/*"
  respect_gitignore: true
  ignore:
    - ".git/**"
    - "node_modules/**"
    - ".build/**"
    - "dist/**"
    - ".tmp/**"
    - ".pi/**"
    - ".pi-funzzy-*.json"
    - ".watch.sock"
    - "**/__pycache__/**"
  socket: .watch.sock

execution:
  concurrency: 1
  output: show-on-failure
  timeout: 5m

jobs:
  - name: quality-gate
    run_on_init: true
    run: make gate
