## Funzzy events file — .watch.yaml
# Comprehensive commented starter: small active setup, every supported
# option documented in comments. Full reference: `fzz config schema`.
#
# Next commands:
#   fzz check                  validate this file (no watcher)
#   fzz list                   show configured jobs
#   fzz run <name>             run one job once
#   fzz / fzz watch            start watching
#   fzz control status         talk to the running watcher
#   fzz config example minimal tiny machine-copyable starter

on:
  # Run the canonical guardrail gate on repository changes, including globally ignored AGENTS.md guides.
  change: "**/*"
  respect_gitignore: false
  ignore:
    - ".git/**"
    - "node_modules/**"
    - ".build/**"
    - "dist/**"
    - ".tmp/**"
    - "coverage/**"
    - "**/__pycache__/**"
    - ".watch.sock"
    - ".pi/bebop/inbox/**"
    - ".pi/bebop/sockets/**"
    - ".pi/bebop/intake/new/**"
    - ".pi/bebop/intake/processed/**"
    - ".pi/bebop/intake/failed/**"
    - ".pi/bebop/intake/receipts/**"
    - ".pi/bebop/intake/commits/**"
    - ".pi/bebop/intake/.scan.lock"
    - ".pi/welder-log/**"
  # socket: Control socket path; enables the control surface (`fzz control`)
  socket: .watch.sock
  # debounce: Filesystem batch debounce window (default: 1s)
  # debounce: 500ms
  # watch_backend: Watch backend: native first, then poll when native is unavailable (default: auto) values: native | poll | auto
  # watch_backend: poll
  # poll_interval: Poll backend interval (only meaningful with `watch_backend: poll`) (default: 500ms)
  # poll_interval: 200ms

execution:
  # concurrency: Global cap on simultaneously active tasks (default: machine parallelism)
  concurrency: 2
  # output: Default output policy for every job (default: inherit) values: inherit | quiet | capture | show-on-failure
  output: show-on-failure
  timeout: 5m
  # recovery_policy: Recovery approval policy for failed jobs with a recovery command; missing TTY safely skips (default: prompt) values: prompt | skip
  # recovery_policy: prompt
  # recovery_timeout: Maximum time to wait for interactive recovery approval (default: 60s)
  # recovery_timeout: 60s
  # env: Default environment values inherited by jobs, readiness/recovery commands, and hooks; job env overrides these defaults
  # env:
  #   APP_MODE: test
  #   OPTIONAL_FLAG: ''

jobs:
  # Optional job properties — uncomment the reference job to activate:
  #
  # name: Stable job identity; also the runtime task name. Must be unique
  # run: Command(s): a shell string or an argv list. New job scripts read FZZ_TRIGGER_PATH, FZZ_TRIGGER_RELATIVE_PATH, or the FZZ_TRIGGER_PATHS_FILE JSON batch pointer from filesystem-triggered child environments; pathless init/manual runs and hooks receive none. Legacy path templates ({{filepath}}, {{absolute_path}}, {{relative_filepath}}, {{relative_path}}, and {{paths}}, including spacing variants) remain supported but are deprecated for new scripts. {{paths}} keeps its shell-escaped, space-joined expansion as one direct-argv element
  # recovery: Optional ordered shell commands offered for one approved recovery after this job fails; declaration never authorizes execution
  # parallel: Named contiguous group; members run concurrently within the concurrency cap
  # cwd: Working directory for this job, relative to the workspace root
  # env: Per-job environment; values are never echoed or generated
  # trigger: Explicit run only (`fzz run TARGET` / `fzz ctl run TARGET`); never matches filesystem events or runs at init values: manual
  # timeout: Bound this finite job's execution; on elapse the job is terminated and fails the generation. Not a client await deadline. Positive duration with ms/s/m units (bare number = seconds)
  # service: Managed long-running service: owned by the active generation; restarted by re-inclusion in a replacement generation and retried up to 3 times on non-zero exit; stopped on supersession or exit (default: false)
  # readiness: Application health command for a managed service; successful readiness settles the generation while the service remains managed
  # output: Job output policy override; inherits execution.output when absent values: inherit | quiet | capture | show-on-failure
  #
  # - name: reference
  #   run: ./scripts/check-changed.sh
  #   recovery: cargo fmt --all
  #   change: ["**/*.rs", "**/*.md"]
  #   ignore: ["**/*.log"]
  #   parallel: checks
  #   cwd: scripts
  #   env:
  #     FOO: bar
  #   trigger: manual
  #   timeout: 30m
  #   service: true
  #   service: true
  #   readiness:
  #     run: curl --fail http://localhost/health
  #     timeout: 30s
  #   output: show-on-failure

  - name: quality-gate
    # Verify the repository immediately and whenever a non-generated path changes.
    run_on_init: true
    run: make gate
